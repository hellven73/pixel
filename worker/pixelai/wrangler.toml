name = "pixelai"
main = "worker.mjs"
compatibility_date = "2026-11-20"
workers_dev = true
preview_urls = false

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://pixelarcade.com.au,https://hellven73.github.io"
DAILY_REQUESTS = "45"
DAILY_IMAGES = "12"
GROQ_MODEL_DAILY_REQUESTS = "24"
OPENROUTER_DAILY_REQUESTS = "40"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]
