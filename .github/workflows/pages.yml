name: Deploy Pixel Arcade
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hellven73/pixel-portal
          ref: 30121120e501617f6f5610cb97a8664a5465afbf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare website
        run: npm ci --ignore-scripts && npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
